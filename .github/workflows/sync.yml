name: Sync Books

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          CI: "true"
          ZLIBRARY_EMAIL: ${{ secrets.ZLIBRARY_EMAIL }}
          ZLIBRARY_PASSWORD: ${{ secrets.ZLIBRARY_PASSWORD }}
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        run: python book-sync-zlib.py

      - name: Commit downloaded.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore: update downloaded books list"
            git push
          else
            echo "No new books downloaded"
          fi
