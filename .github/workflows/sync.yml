name: Sync Books

on:
  workflow_dispatch:  # manual trigger from GitHub UI or gh CLI

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to commit downloaded.txt back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          CI: "true"
          DEBUG: "true"
        run: python book-sync-anna.py

      - name: Upload epubs
        uses: actions/upload-artifact@v4
        with:
          name: epubs-${{ github.run_id }}
          path: downloads/
          retention-days: 30
          if-no-files-found: warn

      - name: Commit downloaded.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore: update downloaded books list"
            git push
          else
            echo "No changes to downloaded.txt"
          fi
